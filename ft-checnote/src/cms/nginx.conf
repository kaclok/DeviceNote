
#user  nobody;
worker_processes  1;

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;


events {
    worker_connections  1024;
}


http {
    include       mime.types;
    default_type  application/octet-stream;

    #log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
    #                  '$status $body_bytes_sent "$http_referer" '
    #                  '"$http_user_agent" "$http_x_forwarded_for"';

    #access_log  logs/access.log  main;

    sendfile        on;
    #tcp_nopush     on;

    #keepalive_timeout  0;
    keepalive_timeout  65;
    client_max_body_size 20M;

    #gzip  on;

    server {
        listen 4175;
        server_name  localhost;
        location / {
            root D:\Deploy\device-note\frontend\dist;
            index index.html index.htm;
            # add_header Access-Control-Allow-Origin *;
            # add_header Access-Control-Allow-Methods GET,POST,OPTIONS;
            # add_header Access-Control-Allow-Headers DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range;
            # add_header Access-Control-Expose-Headers Content-Length,Content-Range;

            # 使用Nginx解决跨域访问的完整实例 https://blog.csdn.net/tombosky/article/details/135504779
            add_header Access-Control-Allow-Origin '*';
            add_header Access-Control-Allow-Methods 'GET, POST, OPTIONS';
            add_header Access-Control-Allow-Headers 'DNT,User-Agent,X-Requested-With,If-Modified-Since,Cache-Control,Content-Type,Range,Authorization';
            add_header Access-Control-Expose-Headers 'Content-Length,Content-Range';
        }

        location /api/ {
            proxy_pass http://10.8.54.24:7090/;
            rewrite ^/api/(.*)$ /$1 break;
        }
    }

    server {
        listen 4177;
        server_name localhost;

        # ① 入口 HTML 必须回源：不要用 no-store，no-cache 就够（能走 304，省流量）
        # `no-cache` 的意思是： HTML 每次都要找服务器确认一下有没有更新 （没更新就走 304，很省流量；有更新就用新的）

        # ③ 用户刷新 → 浏览器必须问服务器 → 拿到【新 HTML】
        # ④ 新 HTML 引用新文件名 → home.jXhVJPSE.js
        # ⑤ 这个文件服务器上确实有 → 正常加载 ✓

        # 为什么这样就彻底好了？ 因为 HTML 是唯一入口，只要入口永远是最新的，它引用的所有文件就必然存在，不可能会 404
        location ~* \.html$ {
            root D:/Deploy/device-note/frontend/dist-checknote;
            add_header Cache-Control "no-cache";
        }

        # APK 下载（关键：用 root，不用 alias）
        location ^~ /downloads/ {
            root D:/Deploy/;
            try_files $uri =404;

            # ③ 不改名的静态文件：回源校验，别让 nginx 默认缓存策略接管
            add_header Cache-Control "no-cache" ;
            add_header Content-Disposition "attachment";
            add_header Content-Type application/octet-stream;
        }

        # JSON 配置文件
        location ^~ /configs/ {
            root D:/Deploy/;

            # ③ 不改名的静态文件：回源校验，别让 nginx 默认缓存策略接管
            add_header Cache-Control "no-cache" ;
            add_header Content-Type application/json;
        }

        # API
        location /api/ {
            proxy_pass http://10.8.54.24:7090/;
            rewrite ^/api/(.*)$ /$1 break;
        }

        location /api/apiWatchdog/ {
            proxy_pass http://10.8.54.24:8091/;
            rewrite ^/api/(.*)$ /$1 break;
        }

        location /sse/ {
            proxy_pass http://10.8.54.24:7090/;
        }

        # SPA
        location / {
            root D:/Deploy/device-note/frontend/dist-checknote;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

