<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人员信息管理系统 - 新增人员</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Microsoft YaHei', Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 30px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .form-container {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 30px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
            font-size: 16px;
        }

        .form-group label span {
            color: #ff4444;
            margin-left: 5px;
        }

        .form-group input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            outline: none;
        }

        .form-group input[type="text"]:focus {
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102,126,234,0.1);
        }

        /* 照片上传区域样式 */
        .photo-upload {
            border: 2px dashed #e0e0e0;
            border-radius: 10px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
            position: relative;
        }

        .photo-upload:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }

        .photo-preview {
            width: 150px;
            height: 150px;
            margin: 0 auto 15px;
            border-radius: 10px;
            overflow: hidden;
            background: #f5f5f5;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .photo-preview img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .photo-placeholder {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: #999;
        }

        .photo-placeholder i {
            font-size: 48px;
            margin-bottom: 10px;
        }

        .photo-placeholder p {
            font-size: 14px;
        }

        .upload-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
            display: inline-block;
        }

        .upload-btn:hover {
            background: #5a67d8;
            transform: translateY(-2px);
        }

        #photoInput {
            display: none;
        }

        .file-info {
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }

        /* 按钮样式 */
        .button-group {
            display: flex;
            gap: 15px;
            margin-top: 30px;
        }

        .btn-save {
            flex: 1;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-save:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102,126,234,0.4);
        }

        .btn-reset {
            flex: 1;
            background: #f0f0f0;
            color: #666;
            border: none;
            padding: 14px;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn-reset:hover {
            background: #e0e0e0;
        }

        /* 提示消息 */
        .message {
            position: fixed;
            top: 20px;
            right: 20px;
            padding: 15px 20px;
            border-radius: 10px;
            background: white;
            box-shadow: 0 5px 20px rgba(0,0,0,0.2);
            display: none;
            animation: slideIn 0.3s ease;
            z-index: 1000;
        }

        .message.success {
            border-left: 4px solid #4caf50;
            color: #4caf50;
        }

        .message.error {
            border-left: 4px solid #ff4444;
            color: #ff4444;
        }

        @keyframes slideIn {
            from {
                transform: translateX(100%);
                opacity: 0;
            }
            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        /* 人员列表样式 */
        .person-list {
            margin-top: 30px;
            border-top: 1px solid #e0e0e0;
            padding-top: 20px;
        }

        .person-list h3 {
            margin-bottom: 15px;
            color: #333;
        }

        .person-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .person-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            background: #ddd;
        }

        .person-info {
            flex: 1;
        }

        .person-name {
            font-weight: bold;
            color: #333;
            margin-bottom: 5px;
        }

        .person-time {
            font-size: 12px;
            color: #999;
        }

        .delete-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 5px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
        }

        .delete-btn:hover {
            background: #cc0000;
        }

        /* 响应式 */
        @media (max-width: 768px) {
            .form-container {
                padding: 20px;
            }
            
            .button-group {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>📝 新增人员信息</h1>
            <p>请填写以下信息并上传照片</p>
        </div>

        <div class="form-container">
            <form id="personForm">
                <div class="form-group">
                    <label for="name">姓名 <span>*</span></label>
                    <input type="text" id="name" name="name" placeholder="请输入姓名" required>
                </div>

                <div class="form-group">
                    <label>照片上传 <span>*</span></label>
                    <div class="photo-upload" onclick="document.getElementById('photoInput').click()">
                        <div class="photo-preview" id="photoPreview">
                            <div class="photo-placeholder">
                                <i>📷</i>
                                <p>点击上传照片</p>
                            </div>
                        </div>
                        <input type="file" id="photoInput" accept="image/*" onchange="previewPhoto(this)">
                        <div class="file-info" id="fileInfo">
                            支持 JPG、PNG、GIF 格式，大小不超过5MB
                        </div>
                    </div>
                </div>

                <div class="button-group">
                    <button type="submit" class="btn-save">💾 保存人员信息</button>
                    <button type="button" class="btn-reset" onclick="resetForm()">🔄 重置表单</button>
                </div>
            </form>

            <div class="person-list" id="personList">
                <h3>已保存人员列表</h3>
                <div id="personListContainer">
                    <!-- 人员列表会动态显示在这里 -->
                </div>
            </div>
        </div>
    </div>

    <div id="message" class="message"></div>

    <script>
        // 存储人员信息的数组
        let persons = [];

        // 当前选择的照片数据
        let currentPhotoData = null;

        // 页面加载时从localStorage读取已保存的数据
        window.onload = function() {
            loadFromStorage();
            displayPersons();
        };

        // 预览照片
        function previewPhoto(input) {
            const file = input.files[0];
            if (!file) return;

            // 验证文件类型
            const validTypes = ['image/jpeg', 'image/jpg', 'image/png', 'image/gif'];
            if (!validTypes.includes(file.type)) {
                showMessage('请上传 JPG、PNG 或 GIF 格式的图片', 'error');
                return;
            }

            // 验证文件大小 (5MB)
            if (file.size > 5 * 1024 * 1024) {
                showMessage('图片大小不能超过 5MB', 'error');
                return;
            }

            const reader = new FileReader();
            reader.onload = function(e) {
                currentPhotoData = e.target.result;
                const preview = document.getElementById('photoPreview');
                preview.innerHTML = `<img src="${currentPhotoData}" alt="预览图">`;
                
                const fileInfo = document.getElementById('fileInfo');
                fileInfo.innerHTML = `已选择: ${file.name} (${(file.size / 1024).toFixed(2)} KB)`;
                fileInfo.style.color = '#4caf50';
            };
            reader.readAsDataURL(file);
        }

        // 保存人员信息
        function savePerson(event) {
            event.preventDefault();

            const nameInput = document.getElementById('name');
            const name = nameInput.value.trim();

            // 验证姓名
            if (!name) {
                showMessage('请输入姓名', 'error');
                nameInput.focus();
                return;
            }

            // 验证照片
            if (!currentPhotoData) {
                showMessage('请上传照片', 'error');
                return;
            }

            // 创建人员对象
            const person = {
                id: Date.now(),
                name: name,
                photo: currentPhotoData,
                createTime: new Date().toLocaleString()
            };

            // 添加到数组
            persons.push(person);
            
            // 保存到localStorage
            saveToStorage();
            
            // 显示成功消息
            showMessage(`成功添加人员：${name}`, 'success');
            
            // 重置表单
            resetForm();
            
            // 刷新人员列表
            displayPersons();
        }

        // 显示提示消息
        function showMessage(text, type) {
            const messageDiv = document.getElementById('message');
            messageDiv.textContent = text;
            messageDiv.className = `message ${type}`;
            messageDiv.style.display = 'block';
            
            setTimeout(() => {
                messageDiv.style.display = 'none';
            }, 3000);
        }

        // 重置表单
        function resetForm() {
            document.getElementById('personForm').reset();
            document.getElementById('name').value = '';
            currentPhotoData = null;
            
            // 重置照片预览
            const preview = document.getElementById('photoPreview');
            preview.innerHTML = `
                <div class="photo-placeholder">
                    <i>📷</i>
                    <p>点击上传照片</p>
                </div>
            `;
            
            const fileInfo = document.getElementById('fileInfo');
            fileInfo.innerHTML = '支持 JPG、PNG、GIF 格式，大小不超过5MB';
            fileInfo.style.color = '#666';
            
            // 清空文件输入
            document.getElementById('photoInput').value = '';
        }

        // 保存到localStorage
        function saveToStorage() {
            localStorage.setItem('persons', JSON.stringify(persons));
        }

        // 从localStorage加载
        function loadFromStorage() {
            const stored = localStorage.getItem('persons');
            if (stored) {
                persons = JSON.parse(stored);
            }
        }

        // 显示人员列表
        function displayPersons() {
            const container = document.getElementById('personListContainer');
            
            if (persons.length === 0) {
                container.innerHTML = '<div style="text-align: center; color: #999; padding: 20px;">暂无人员数据</div>';
                return;
            }
            
            let html = '';
            persons.forEach(person => {
                html += `
                    <div class="person-item" data-id="${person.id}">
                        <img class="person-avatar" src="${person.photo}" alt="${person.name}">
                        <div class="person-info">
                            <div class="person-name">${escapeHtml(person.name)}</div>
                            <div class="person-time">添加时间：${person.createTime}</div>
                        </div>
                        <button class="delete-btn" onclick="deletePerson(${person.id})">删除</button>
                    </div>
                `;
            });
            
            container.innerHTML = html;
        }

        // 删除人员
        function deletePerson(id) {
            if (confirm('确定要删除该人员信息吗？')) {
                persons = persons.filter(person => person.id !== id);
                saveToStorage();
                displayPersons();
                showMessage('删除成功', 'success');
            }
        }

        // 防止XSS攻击
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 监听表单提交
        document.getElementById('personForm').addEventListener('submit', savePerson);
        
        // 回车提交
        document.getElementById('name').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                savePerson(e);
            }
        });
    </script>
</body>
</html>
